[project]
name = "dreamcode-rsi"
version = "0.1.0"
description = "Recursive Self-Improving Agent Routing and Exploration Engine through Replay Worlds"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "laya>=0.4.0",
    "transformers",
    "torch==2.13.0",
    "gradio>=4.0.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0",
    "networkx>=3.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
